<!DOCTYPE html>
<html>
<head>
    <title>Box Center</title>

    <style>
        .box {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            border: 2px solid black;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            display: flex;
            justify-content: center;
            align-items: center;

            color: purple;
        }
    </style>
</head>

<body>

    <div class="box">
        This is center.
    </div>

</body>
</html>
